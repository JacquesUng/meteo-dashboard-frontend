<mat-table [dataSource]="configurations()">

  <ng-container matColumnDef="Id">
    <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
    <mat-cell *matCellDef="let row">{{ row.Id }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
    <mat-cell *matCellDef="let row">{{ row.name }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="startDate">
    <mat-header-cell *matHeaderCellDef>Start date</mat-header-cell>
    <mat-cell *matCellDef="let row">{{ row.startDate }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="timespan">
    <mat-header-cell *matHeaderCellDef>Timespan (h)</mat-header-cell>
    <mat-cell *matCellDef="let row">{{ row.timespan }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
    <mat-cell *matCellDef="let row">
      <button mat-icon-button (click)="taskService.schedule(row.Id)">
        <mat-icon>play_arrow</mat-icon>
      </button>
      <button mat-icon-button (click)="taskService.delete(row.Id)">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>

</mat-table>
